name: Deploy to Netlify

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Netlify's default Node.js version
      
      # Install dependencies for the serverless function, if any
      - name: Install function dependencies
        run: |
          if [ -f "netlify/functions/package.json" ]; then
            npm install --prefix netlify/functions
          else
            echo "No package.json found for functions, skipping."
          fi
          # We need node-fetch for our gemini.js function
          npm install node-fetch@2

      - name: Deploy to Netlify
        uses: ntlfy/actions/deploy@v1
        id: netlify
        with:
          # This is the authentication token for Netlify CLI
          auth-token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          # This is the Site ID for your Netlify site
          site-id: ${{ secrets.NETLIFY_SITE_ID }}
          # This specifies the directory to deploy
          dir: './'
          # This passes the Gemini API Key as an environment variable to the function
          functions-dir: './netlify/functions'
        env:
          # This makes the secret available to the Netlify build environment
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          
      - name: Echo Netlify Deploy URL
        run: echo "Successfully deployed to ${{ steps.netlify.outputs.url }}" 
